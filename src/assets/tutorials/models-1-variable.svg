<svg xmlns="http://www.w3.org/2000/svg" fill="#23382f" viewBox="0 0 560 300" role="img" aria-label="引擎域通过 GCP_MODELS_DIR 找到权重目录">
  <defs>
    <style>
      .t{font-family:"Inter","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
      .m{font-family:"SFMono-Regular",Consolas,monospace}
      .card{fill:#fffefa;stroke:#dedfd5;stroke-width:1.2}
    </style>
  </defs>
  <rect width="560" height="300" rx="10" fill="#f6f5f1"/>
  <text x="28" y="34" class="t" font-size="12" font-weight="600">模型目录是一个真正的环境变量，不是目录树约定</text>
  <text x="28" y="54" class="t" font-size="9.5" fill="#798078">引擎域用 GCP_MODELS_DIR 定位权重根，所以它可以放在任意磁盘。</text>

  <rect x="28" y="92" width="150" height="90" rx="9" class="card"/>
  <text x="42" y="114" class="t" font-size="10.5" font-weight="600">engines 域</text>
  <text x="42" y="134" class="t" font-size="9" fill="#798078">语音、图像、翻译</text>
  <text x="42" y="150" class="t" font-size="9" fill="#798078">所有权重加载</text>
  <text x="42" y="170" class="t m" font-size="8.5" fill="#386a50">weights.models_dir()</text>

  <path d="M182 137 H232" stroke="#386a50" stroke-width="1.6" fill="none"/>
  <path d="M226 131 L236 137 L226 143" fill="none" stroke="#386a50" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="246" y="116" width="120" height="42" rx="7" fill="#e4eddf"/>
  <text x="306" y="133" class="t m" font-size="9" text-anchor="middle" font-weight="600">GCP_MODELS_DIR</text>
  <text x="306" y="148" class="t" font-size="8.5" text-anchor="middle" fill="#386a50">启动器注入</text>

  <path d="M370 137 H418" stroke="#386a50" stroke-width="1.6" fill="none"/>
  <path d="M412 131 L422 137 L412 143" fill="none" stroke="#386a50" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="430" y="100" width="102" height="150" rx="9" class="card"/>
  <text x="442" y="120" class="t" font-size="9" fill="#798078">你的权重目录</text>
  <g class="t m" font-size="9">
    <text x="442" y="142">hf_cache/</text>
    <text x="442" y="160">torch_cache/</text>
    <text x="442" y="178">nemo_cache/</text>
    <text x="442" y="196">modelscope/</text>
    <text x="442" y="214">paddlex/</text>
    <text x="442" y="232">beats/</text>
  </g>

  <g class="t" font-size="9.5">
    <text x="28" y="212" font-weight="600">为什么值得单独放</text>
    <text x="28" y="232" fill="#798078">体积大、读取频繁、只在需要时</text>
    <text x="28" y="248" fill="#798078">增长，和程序目录的生命周期不同。</text>
    <text x="28" y="270" fill="#386a50">放在数据盘，重装程序不用重下。</text>
  </g>
</svg>
