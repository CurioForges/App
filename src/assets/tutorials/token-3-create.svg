<svg xmlns="http://www.w3.org/2000/svg" fill="#23382f" viewBox="0 0 400 300" role="img" aria-label="创建 Token 并立即复制">
  <defs>
    <style>
      .t{font-family:"Inter","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
      .m{font-family:"SFMono-Regular",Consolas,monospace}
      .inverse{fill:#fffefa}
    </style>
  </defs>
  <rect width="400" height="300" rx="10" fill="#f6f5f1"/>
  <rect x="10" y="10" width="380" height="280" rx="8" fill="#eeeee7" stroke="#dedfd5" stroke-width="1.2"/>
  <path d="M10 18a8 8 0 0 1 8-8h364a8 8 0 0 1 8 8v20H10z" fill="#dedfd5" opacity=".6"/>

  <rect x="30" y="40" width="340" height="150" rx="8" fill="#fffefa" stroke="#dedfd5" stroke-width="1.2"/>
  <text x="46" y="64" class="t" font-size="11" font-weight="700">Create new token</text>
  <line x1="30" y1="74" x2="370" y2="74" stroke="#dedfd5"/>

  <text x="46" y="92" class="t" font-size="8.5" font-weight="600">Name</text>
  <rect x="46" y="98" width="308" height="24" rx="5" fill="#fffefa" stroke="#386a50" stroke-width="1.2"/>
  <text x="58" y="114" class="t m" font-size="9.5">atelier-weights</text>

  <text x="46" y="140" class="t" font-size="8.5" font-weight="600">Token type</text>
  <rect x="46" y="146" width="74" height="24" rx="5" fill="#e4eddf" stroke="#386a50" stroke-width="1.2"/>
  <circle cx="59" cy="158" r="4" fill="#386a50"/><circle cx="59" cy="158" r="1.6" fill="#fffefa"/>
  <text x="71" y="162" class="t" font-size="9" font-weight="600" fill="#386a50">Read</text>
  <rect x="128" y="146" width="74" height="24" rx="5" fill="#fffefa" stroke="#dedfd5"/>
  <circle cx="141" cy="158" r="4" fill="none" stroke="#dedfd5" stroke-width="1.3"/>
  <text x="153" y="162" class="t" font-size="9" fill="#798078">Write</text>
  <rect x="210" y="146" width="80" height="24" rx="5" fill="#fffefa" stroke="#dedfd5"/>
  <circle cx="223" cy="158" r="4" fill="none" stroke="#dedfd5" stroke-width="1.3"/>
  <text x="235" y="162" class="t" font-size="8" fill="#798078">Fine-grained</text>
  <rect x="274" y="174" width="80" height="22" rx="5" fill="#386a50"/>
  <text x="314" y="189" class="t inverse" font-size="8.5" text-anchor="middle" font-weight="600">Create token</text>

  <rect x="30" y="200" width="340" height="76" rx="8" fill="#e4eddf"/>
  <text x="46" y="220" class="t" font-size="9" font-weight="600" fill="#386a50">令牌只显示这一次</text>
  <rect x="46" y="228" width="238" height="22" rx="4" fill="#fffefa" stroke="#386a50" stroke-width="1"/>
  <text x="56" y="243" class="t m" font-size="8.5" fill="#386a50">hf_XXXXXXXXXXXXXXXXXXXX</text>
  <rect x="292" y="228" width="46" height="22" rx="4" fill="#386a50"/>
  <text x="315" y="243" class="t inverse" font-size="8" text-anchor="middle" font-weight="600">Copy</text>
  <text x="46" y="266" class="t" font-size="8" fill="#386a50">复制后直接粘贴回启动器；离开页面就再也看不到。</text>
</svg>
