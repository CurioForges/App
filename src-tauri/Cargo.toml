[package]
name = "atelier-desktop"
version = "0.3.8"
edition = "2021"
[[bin]]
name = "atelier"
path = "src/main.rs"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS is required: the token check talks to Hugging Face over https, and the
# blocking client is also used for the local http health endpoint.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "default-tls"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }
