name: Release Atelier

# master 有提交就自动发版：patch 递增 → 改写 Cargo.toml / tauri.conf.json → 构建 → 打 tag → 发 release。
# 只发布启动器本体（公开仓库）。

on:
  push:
    branches: [master]
    paths-ignore:
      - '.gitea/**'
      - 'ci/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      bump:
        description: 版本递增类型
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'release:')"
    runs-on: windows-x64
    timeout-minutes: 60
    env:
      GITEA_TOKEN: ${{ secrets.ATELIER_PAT }}
      GITEA_URL: https://atelier.hurcaguari.top
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ATELIER_PAT }}
          fetch-depth: 0

      - name: Resolve next version and notes
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bump = if ('${{ inputs.bump }}') { '${{ inputs.bump }}' } else { 'patch' }
          $tags = @(git tag --list 'v*' --sort=-v:refname)
          $latest = if ($tags.Count -gt 0) { $tags[0] } else { 'v0.0.0' }
          $parts = $latest.TrimStart('v').Split('.')
          $major = [int]$parts[0]; $minor = [int]$parts[1]; $patchN = [int]$parts[2]
          switch ($bump) {
            'major' { $major++; $minor = 0; $patchN = 0 }
            'minor' { $minor++; $patchN = 0 }
            default { $patchN++ }
          }
          $version = "$major.$minor.$patchN"
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_ENV
          "TAG=$tag"        >> $env:GITHUB_ENV
          "prev=$latest"    >> $env:GITHUB_OUTPUT
          $subject = ("$(git log -1 --pretty=%s)").Trim()
          $body = ("$(git log -1 --pretty=%b)").Trim()
          $changes = if ($tags.Count -gt 0) { (@(git log --pretty='- %s (%h)' "$latest..HEAD") -join "`n").Trim() } else { '' }
          $notes = (@($subject, '', $body, '', "### Changes since $latest", $changes) -join "`n").Trim()
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'release-notes.md'), $notes, (New-Object System.Text.UTF8Encoding($false)))
          "release: $latest -> $tag"

      - name: Bump version files
        shell: pwsh
        run: |
          $v = $env:version
          $cargo = 'src-tauri/Cargo.toml'
          $conf = 'src-tauri/tauri.conf.json'
          $cargoText = Get-Content $cargo -Raw
          $cargoText = [regex]::Replace($cargoText, '(?m)^version = "[^"]+"', "version = `"$v`"", 1)
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $cargo), $cargoText, (New-Object System.Text.UTF8Encoding($false)))
          if (Test-Path $conf) {
            $j = Get-Content $conf -Raw | ConvertFrom-Json
            $j.version = $v
            $json = $j | ConvertTo-Json -Depth 20
            [System.IO.File]::WriteAllText((Join-Path (Get-Location) $conf), $json, (New-Object System.Text.UTF8Encoding($false)))
          }
          git config user.name 'Atelier Release'
          git config user.email 'release@atelier.local'
          git add $cargo
          if (Test-Path $conf) { git add $conf }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -q -m "release: v$v [skip ci]" }
          git push origin HEAD
          "version files bumped to $v"

      - name: Install frontend deps
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }

      - name: Build app
        shell: pwsh
        run: |
          npm run tauri build -- --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }
          $exe = 'src-tauri/target/release/atelier.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          Copy-Item $exe 'atelier.exe' -Force
          $h = (Get-FileHash 'atelier.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  atelier.exe" | Set-Content SHA256SUMS.txt -Encoding ASCII
          "atelier.exe $([math]::Round((Get-Item 'atelier.exe').Length/1MB,1)) MB"

      - name: Create tag and release
        shell: pwsh
        run: |
          $headers = @{ Authorization = "token $($env:GITEA_TOKEN)" }
          $api = "$env:GITEA_URL/api/v1/repos/Atelier/Atelier"
          $notes = Get-Content release-notes.md -Raw
          $tagBody = @{ tag_name = $env:TAG; target = (git rev-parse HEAD).Trim(); message = "release $env:TAG" } | ConvertTo-Json -Compress
          try { Invoke-RestMethod -Uri "$api/tags" -Method Post -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($tagBody)) -TimeoutSec 60 | Out-Null; "tag $env:TAG created" } catch { "tag: $($_.Exception.Message)" }
          $relBody = @{ tag_name = $env:TAG; name = "Atelier $env:TAG"; body = $notes; draft = $false; prerelease = $false } | ConvertTo-Json -Compress
          $rel = Invoke-RestMethod -Uri "$api/releases" -Method Post -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($relBody)) -TimeoutSec 60
          foreach ($f in @('atelier.exe', 'SHA256SUMS.txt')) {
            $name = $f
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $f).Path)
            $boundary = [guid]::NewGuid().ToString()
            $head = "--$boundary`r`nContent-Disposition: form-data; name=`"attachment`"; filename=`"$name`"`r`nContent-Type: application/octet-stream`r`n`r`n"
            $tail = "`r`n--$boundary--`r`n"
            $ms = New-Object System.IO.MemoryStream
            $hb = [Text.Encoding]::UTF8.GetBytes($head); $tb = [Text.Encoding]::UTF8.GetBytes($tail)
            $ms.Write($hb,0,$hb.Length); $ms.Write($bytes,0,$bytes.Length); $ms.Write($tb,0,$tb.Length)
            Invoke-RestMethod -Uri "$api/releases/$($rel.id)/assets?name=$name" -Method Post -Headers $headers -ContentType "multipart/form-data; boundary=$boundary" -Body $ms.ToArray() -TimeoutSec 900 | Out-Null
            "  ↑ $name"
          }
          "release $env:TAG ready"
