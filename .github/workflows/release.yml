name: Release Atelier

# 发布桌面应用本体。版本号取自 src-tauri/Cargo.toml 的 version,必须与 tag 一致。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号(与 Cargo.toml 一致,例如 0.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Check version matches input
        shell: pwsh
        run: |
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          "cargo=$cargo" >> $env:GITHUB_ENV
          if ($cargo -ne '${{ inputs.version }}') {
            throw "Cargo.toml 版本 $cargo 与输入 ${{ inputs.version }} 不一致"
          }

      - name: Build app
        run: npm run tauri build -- --no-bundle

      - name: Checksums
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/atelier.exe'
          if (-not (Test-Path $exe)) { throw "构建产物缺失: $exe" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  atelier.exe" | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ inputs.version }}"
          Copy-Item 'src-tauri/target/release/atelier.exe' 'atelier.exe'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Atelier $tag" --notes "Atelier $tag" }
          gh release upload $tag atelier.exe SHA256SUMS.txt --clobber